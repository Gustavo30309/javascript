<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes e Depois</title>
</head>
<body>
    <h1>Antes e depois</h1>
    <button onclick="verificar()">Antecessor e Sucessor</button>
    <script>
        function verificar() {
           var n = Number(window.prompt('Digite um número inteiro qualquer'))
           var a = n - 1
           var s = n + 1 
           var gg = document.write(`Antes de ${n}, temos o número ${a}. <br>`)
           var rj = document.write(`Depois de ${n}, Temos o número ${s}.`)
           window.alert(`${gg} ${rj}`)
        }
    </script>
</body>
</html>
