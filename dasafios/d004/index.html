<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasafio boas-vindas</title>
</head>
<body>
    <h1>Calculando o Troco</h1>
    <button onclick="troco()">Compra produto</button>
    <script>
        function troco() {
            var produto = prompt('Que produto você está comprando?')
            var preco = prompt(`Quanto custa ${produto} que você está comprando? `)
            var pago = prompt(`Qual foi o valor que você deu para pagar ${produto}?`)
            var troco = pago - preco
            alert(`Você comprou ${produto} que custou R$${preco}. Deu R$${pago} em dinheiro e vai receber R$${troco} de troco. Volte sempre!`)
        }
    </script>
</body>
</html>
