<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasafio boas-vindas</title>
</head>
<body>
    <h1>Boas-vindas</h1>
    <button onclick="boa()">Inicie o dasafio</button>
    <script>
        function boa() {
            var nome = prompt('Qual é seu nome?')
            var anos = prompt(`Olá, ${nome}! Quantos anos você tem?`)
            alert(`Acabei de conhecer ${nome}, que tem ${anos} anos de idade!`)
        }
    </script>
</body>
</html>
