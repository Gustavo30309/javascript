<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/icone-github.png" type="image/x-icon">
     <link
href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
rel='stylesheet'>
    <title>Projeto 01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="container">
        <form>
            <h1>Login DevClub</h1>
            <div class="input-box">
                <input placeholder="Usuário" type="email" id="usuario">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" id="senha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label>
                <input type="checkbox">
                Lembra senha
                <a href="#">Esqueci senha</a>
                </label>
            </div>

            <button type="submit" id="login" onclick="acesso()">Login</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="#">Catrastre-se</a></p>
            </div>
        </form>
    </main>
    <script src="login.js"></script>
</body>
</html>
