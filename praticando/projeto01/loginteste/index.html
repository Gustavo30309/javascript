<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link
href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <style>
        #titulo {
            color: white;
        }
    </style>
</head>
<body>
    <main id="container">
        <h1 id="titulo">Nome de usuário</h1>
        <div class="input-box">

            <div class="input-box">
                <input type="text" placeholder="Usuário" id="usuario">
                <i class="bx bxs-user"></i><br>
            </div>

            
            <div class="input-box">
                <input type="password" placeholder="Senha" id="senha">
                <i class="bx bxs-lock-alt"></i><br>
            </div>

            <button onclick="verificar()" id="login">Verificar</button>
        </div>
    </main>
    <script>
        function verificar() {
            var usuario = document.getElementById('usuario').value
            var senha = document.getElementById('senha').value
            if (usuario == 'gustavo' && senha == 'apex30309') {
                window.location.href = 'acessoteste/pag2teste.html'
            }
        }
    </script>
</body>
</html>
